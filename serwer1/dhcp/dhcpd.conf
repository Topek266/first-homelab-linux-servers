#=======================================#
#         Konfiguracja DHCP             #
#=======================================#

authoritative;

# Domyślny czas dzierżawy IP w sekundach
default-lease-time 600;
# Maksymalny czas dzierżawy IP w sekundach
max-lease-time 7200;

# Zakres adresów przydzielanych hostom
subnet 192.168.66.0 netmask 255.255.255.0 {
    # Zakres DHCP
    range 192.168.66.50 192.168.66.100;
    # Brama Domyślna
    option routers 192.168.66.0;
    # Serwer DNS
    option domain-name-servers 192.168.66.1;
    # Adres broadcast
    option broadcast-address 192.168.66.255;
  }

# Rezerwacja adresu ip
## Nazwa hosta
host klient1 {
    # Adres MAC hosta
    hardware ethernet 52:54:00:45:66:b2;
    # Przypisany i stały adres IP
    fixed-address 192.168.66.49;
  }
